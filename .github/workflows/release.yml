name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: .venv\Scripts\python.exe -m unittest discover -s tests
      - name: Build application
        run: ./build_gui.ps1
      - name: Verify frozen application startup
        run: |
          $exe = Join-Path $PWD 'dist/AvatarFishingBot/Avatools 3x.exe'
          foreach ($flag in @('--ui-check', '--smoke-test')) {
            $check = Start-Process -FilePath $exe -ArgumentList $flag -WindowStyle Hidden -Wait -PassThru
            if ($check.ExitCode -ne 0) { throw "Frozen diagnostic failed: $flag" }
          }
          $ui = Get-Content dist/AvatarFishingBot/gui-ui-check.json -Raw | ConvertFrom-Json
          $expected = & .venv\Scripts\python.exe -c "from ui.branding import APP_VERSION; print(APP_VERSION)"
          if ($ui.worker_started -or $ui.assets_loaded -lt 1 -or $ui.version -ne $expected) { throw 'Frozen UI metadata check failed' }
      - name: Package distribution
        run: ./package_release.ps1
      - name: Verify portable archive
        run: .venv\Scripts\python.exe tools/verify_release.py --installed dist/AvatarFishingBot
      - uses: actions/upload-artifact@v4
        with:
          name: Avatools-3x-windows-x64
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Avatools-3x-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Avatools 3x $RELEASE_TAG" --notes-file docs/releases/v2.0.0.md
